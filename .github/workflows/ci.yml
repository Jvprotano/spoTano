name: Tests and Windows release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag to build/publish (leave empty to run tests only)'
        required: false
        type: string
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e . --no-deps
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - run: python -m ruff check spotano tests scripts launcher.py
      - run: python -m ruff format --check spotano tests scripts launcher.py
      - run: python -m pytest -q
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e . --no-deps
      - run: python scripts/build.py
      - name: Install FFmpeg for packaged smoke test
        run: choco install ffmpeg --no-progress -y
      - run: python scripts/smoke_frozen.py dist/spoTano/spoTano.exe
      - run: python scripts/sources.py
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:RELEASE_TAG dist/spoTano-*-windows-x64.zip dist/spoTano-*-source.zip dist/SHA256SUMS.txt --title "spoTano $env:RELEASE_TAG" --notes-file docs/RELEASE.md --verify-tag
