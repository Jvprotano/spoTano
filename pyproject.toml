[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "spotano"
version = "1.1.0"
description = "Biblioteca musical local, sincronização de playlists e exportação USB"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = ["spotdl==4.6.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "pyinstaller>=6.11,<7"]

[project.gui-scripts]
spotano = "spotano.__main__:main"

[tool.setuptools.packages.find]
include = ["spotano*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
